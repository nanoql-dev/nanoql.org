version = 1

# Files without a comment header.
[[annotations]]
path = [
  "README.md", "REUSE.toml", ".gitattributes", ".gitignore", "docfx.json", "dotnet-tools.json", "**/*.md",
  "**/toc.yml", "brand/**", "template/favicon.ico", "template/logo.svg", "examples/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The nanoql Authors"
SPDX-License-Identifier = "Apache-2.0"

# docfx 2.81.0's page layout, from its modern template, with the link-preview tags added.
[[annotations]]
path = "template/layout/_master.tmpl"
precedence = "aggregate"
SPDX-FileCopyrightText = [".NET Foundation and Contributors", "2026 The nanoql Authors"]
SPDX-License-Identifier = "MIT"

# Space Grotesk, the wordmark's typeface, served for the site's headings: a Latin subset of its variable font.
[[annotations]]
path = "template/public/fonts/space-grotesk.woff2"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors (https://github.com/floriankarsten/space-grotesk)"
SPDX-License-Identifier = "OFL-1.1"
